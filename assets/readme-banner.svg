<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">KVNG Studio</title>
  <desc id="desc">A dark music workstation banner with a moving playhead, animated level meters, and colorful arrangement clips.</desc>
  <style>
    @keyframes play { from { transform: translateX(0); } to { transform: translateX(464px); } }
    @keyframes level { 0%, 100% { transform: scaleY(.35); } 40% { transform: scaleY(1); } 70% { transform: scaleY(.6); } }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .3; } }
    #playhead { animation: play 5.6s linear infinite; }
    .meter { transform-box: fill-box; transform-origin: center bottom; animation: level 1.2s ease-in-out infinite; }
    #m2 { animation-delay: -.35s; } #m3 { animation-delay: -.7s; } #m4 { animation-delay: -.15s; }
    #live { animation: blink 2.4s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { #playhead, .meter, #live { animation: none; } }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#FF718A"/><stop offset=".52" stop-color="#AD86FF"/><stop offset="1" stop-color="#7BE6D5"/></linearGradient>
    <pattern id="grid" width="58" height="38" patternUnits="userSpaceOnUse"><path d="M58 0H0V38" fill="none" stroke="#233348" stroke-width="1"/></pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0C1421"/>
    <rect x="0" y="0" width="1200" height="7" fill="url(#brand)"/>
    <path d="M0 268h1200" stroke="#314259"/>
    <rect x="0" y="268" width="1200" height="52" fill="#111C2B"/>
    <text x="48" y="59" fill="#91A8BC" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="3">KVNG ENTERPRISE / AUDIO</text>
    <text x="47" y="145" fill="#F1F5F9" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="800" letter-spacing="-3">KVNG</text>
    <text x="269" y="145" fill="url(#brand)" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="800" letter-spacing="-3">STUDIO</text>
    <text x="49" y="190" fill="#C7D4E0" font-family="Menlo,Consolas,monospace" font-size="18">Make something loud.</text>
    <text x="49" y="234" fill="#7BE6D5" font-family="Menlo,Consolas,monospace" font-size="13" letter-spacing="1.6">RUST ENGINE  /  MACOS  /  VST3 + AU</text>
    <rect x="631" y="40" width="523" height="214" rx="10" fill="#111E2F" stroke="#35485F"/>
    <rect x="644" y="54" width="497" height="182" fill="url(#grid)" opacity=".85"/>
    <text x="650" y="75" fill="#879AAF" font-family="Menlo,Consolas,monospace" font-size="11" letter-spacing="1">ARRANGEMENT  ·  120 BPM</text>
    <path d="M644 91h497M644 138h497M644 185h497M644 232h497" stroke="#314158"/>
    <rect x="651" y="101" width="108" height="28" rx="4" fill="#AA78EC"/>
    <rect x="765" y="101" width="108" height="28" rx="4" fill="#AA78EC" opacity=".8"/>
    <rect x="879" y="101" width="108" height="28" rx="4" fill="#AA78EC"/>
    <rect x="993" y="101" width="139" height="28" rx="4" fill="#AA78EC" opacity=".8"/>
    <rect x="651" y="148" width="178" height="28" rx="4" fill="#FF718A"/>
    <rect x="836" y="148" width="139" height="28" rx="4" fill="#FF718A" opacity=".75"/>
    <rect x="981" y="148" width="151" height="28" rx="4" fill="#FF718A"/>
    <path d="M651 215c51-20 71 14 115-3s65-29 110-4 72 13 117-10 85-8 139 9" fill="none" stroke="#7BE6D5" stroke-width="3"/>
    <g id="playhead"><path d="M659 83v148" stroke="#F9E67C" stroke-width="3"/><path d="m653 82 6 8 6-8z" fill="#F9E67C"/></g>
    <circle id="live" cx="60" cy="294" r="5" fill="#7BE6D5"/>
    <text x="73" y="299" fill="#B4C7D8" font-family="Menlo,Consolas,monospace" font-size="12" letter-spacing="1">PLAY / CREATE / MIX</text>
    <text x="845" y="299" fill="#8FA5B8" font-family="Menlo,Consolas,monospace" font-size="12">L</text>
    <rect class="meter" x="871" y="282" width="9" height="23" rx="2" fill="#7BE6D5"/>
    <rect class="meter" id="m2" x="886" y="277" width="9" height="28" rx="2" fill="#7BE6D5"/>
    <rect class="meter" id="m3" x="901" y="285" width="9" height="20" rx="2" fill="#F9E67C"/>
    <rect class="meter" id="m4" x="916" y="280" width="9" height="25" rx="2" fill="#FF718A"/>
    <text x="941" y="299" fill="#8FA5B8" font-family="Menlo,Consolas,monospace" font-size="12">R</text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#3A5067" stroke-width="2"/>
</svg>
