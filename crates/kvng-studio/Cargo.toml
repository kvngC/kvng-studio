[package]
name = "kvng-studio"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"

[dependencies]
flp = { path = "../flp" }
plughost = { path = "../plughost" }
hound = "3.5"
engine = { path = "../engine" }
bridge = { path = "../bridge" }
cpal = "0.18"
ctrlc = "3.5"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.17"
png = "0.18"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
midir = "0.11"
libc = "0.2"
flacenc = "0.4"
