[package]
name = "bridge"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
description = "Runs plugins in helper processes (crash isolation, Intel plugins on Apple Silicon)"

[dependencies]
plughost = { path = "../plughost" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
